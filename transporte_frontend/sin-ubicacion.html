/s<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sin ubicación | Lo Sabe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      min-width: 100%;
      padding: 0;
      background: #e6e6e6;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100vw;
      min-height: 100vh;
    }

    * { box-sizing: border-box; }

    .frame {
      position: relative;
      width: 430px;
      height: 932px;
      background: #e6e6e6;
      overflow: hidden;
    }

    .logo {
      position: absolute;
      left: 125px;
      top: 44px;
      width: 197px;
      height: 99px;
      object-fit: contain;
    }

    .message-card {
      position: absolute;
      left: 36px;
      top: 206px;
      width: 357px;
      height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ebebeb;
      border: 1px solid #bfbebe;
      border-radius: 30px;
      padding: 20px 24px;
    }

    .message-card p {
      margin: 0;
      font-family: "Archivo Narrow", sans-serif;
      font-size: 24px;
      line-height: 1.2;
      color: #000000;
      text-align: center;
      white-space: break-spaces;
    }

    .anterior {
      position: absolute;
      left: 148px;
      top: 501px;
      width: 130px;
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      background: #e6e6e6;
      border: 0;
      border-radius: 20px;
      box-shadow: 8px -8px 8px 2px #ffffff66, -8px 8px 9px 2px #00000026;
      font-family: "Archivo Narrow", sans-serif;
      font-size: 16px;
      color: #808080;
      cursor: pointer;
    }

    .anterior svg {
      width: 14px;
      height: 12.25px;
    }

    .anterior:active {
      transform: translateY(1px);
      box-shadow: inset 3px -3px 5px #ffffff66, inset -3px 3px 5px #00000020;
    }

    .display {
      position: absolute;
      left: 40px;
      top: 589px;
      width: 350px;
      height: 262px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      padding: 20px;
      text-align: center;
      overflow-y: auto;
    }

    .display p {
      margin: 0;
      font-family: "Archivo Narrow", sans-serif;
      font-size: 20px;
      line-height: 1.3;
      color: #3c3c3c;
      white-space: pre-line;
    }

    .display .destino {
      color: #000000;
      font-weight: 600;
    }

    .footer {
      position: absolute;
      left: 134px;
      top: 875px;
      width: 162px;
      height: 20px;
      font-family: "Source Sans 3", sans-serif;
      font-size: 16px;
      color: #808080;
      white-space: pre;
    }
  </style>
</head>
<body>
  <div class="frame">
    <img class="logo" src="logo.png" alt="Lo Sabe">

    <div class="message-card">
      <p>No tenemos tus datos de ubicación, puedes dirigirte a la parada más cercana y escanear nuestro QR para consultar los horarios en esa parada.</p>
    </div>

    <button class="anterior" type="button" onclick="history.back()">
      <svg viewBox="0 0 14 12.25" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M13.125 6.125H0.875M0.875 6.125L4.8125 2.1875M0.875 6.125L4.8125 10.0625" stroke="#808080" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Anterior
    </button>

    <div class="display" id="pista">
      <p>Cargando horarios...</p>
    </div>

    <div class="footer">Información y Contacto</div>
  </div>

  <script src="js/api.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const destino = params.get('destino');
    const pista = document.getElementById('pista');

    const construirPista = (data) => {
      const partes = [];
      if (data.vilaSecca) partes.push(`Vila-seca a las ${data.vilaSecca.hora}`);
      if (data.laPineda) partes.push(`La Pineda a las ${data.laPineda.hora}`);
      if (partes.length === 0) return '';
      return `El próximo autobús con rumbo a\n${destino}\nentra a ${partes.join(' y a ')}.`;
    };

    (async () => {
      if (!destino) {
        pista.innerHTML = '<p>Escanea el QR de tu parada para consultar los horarios.</p>';
        return;
      }
      try {
        const data = await llamarFuncion('proximos-autobuses-destino', { body: { destino } });
        const texto = construirPista(data);
        pista.innerHTML = texto
          ? `<p>${texto}</p>`
          : '<p>Ya no hay más autobuses con rumbo a <span class="destino">' + destino + '</span> hoy.</p>';
      } catch (err) {
        console.error(err);
        pista.innerHTML = '<p>No se pudieron cargar los horarios.</p>';
      }
    })();
  </script>
  <script src="js/adaptar.js"></script>
</body>
</html>
